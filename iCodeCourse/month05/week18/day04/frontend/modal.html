<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css">
    <link rel="stylesheet" href="./css/pokemon.css">
    <title>Document</title>
</head>

<body>
    <div class="filter-modal">
        <div class="filter-box">
            <div class="filter-header">
                <h3>Filters</h3>
                <i class='bx bx-x'></i>
            </div>
            <div class="filter-body">
                <h4>Type</h4>
                <div class="filter-types">
                    <label class="type-item">
                        <input type="checkbox">
                        <span class="checkmark"></span>
                        Normal
                    </label>
                    <label class="type-item">
                        <input type="checkbox">
                        <span class="checkmark"></span>
                        Dragon
                    </label>
                    <label class="type-item">
                        <input type="checkbox">
                        <span class="checkmark"></span>
                        Fire
                    </label>
                    <label class="type-item">
                        <input type="checkbox">
                        <span class="checkmark"></span>
                        Fire
                    </label>
                    <label class="type-item">
                        <input type="checkbox">
                        <span class="checkmark"></span>
                        Fire
                    </label>
                    <label class="type-item">
                        <input type="checkbox">
                        <span class="checkmark"></span>
                        Fire
                    </label>
                </div>
                <h4>Height</h4>
                <div class="filter-height">
                    <div class="filter-small">
                        <img src="./images/small-height.svg" alt="">
                    </div>
                    <div class="filter-medium">
                        <img src="./images/medium-height.svg" alt="">
                    </div>
                    <div class="filter-large">
                        <img src="./images/large-height.svg" alt="">
                    </div>
                </div>
                <h4>Weight</h4>
                <div class="filter-weight">
                    <div class="filter-small">
                        <img src="./images/small-weight.svg" alt="">
                    </div>
                    <div class="filter-medium">
                        <img src="./images/medium-weight.svg" alt="">
                    </div>
                    <div class="filter-large">
                        <img src="./images/large-weight.svg" alt="">
                    </div>
                </div>
            </div>
            <div class="filter-footer">
                <div class="btn outline-btn">Reset filters</div>
                <div class="btn first-btn">Apply filters</div>
            </div>
        </div>
    </div>
</body>

</html>
