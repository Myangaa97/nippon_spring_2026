<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/pokemon.css">
    <title>My Pokédex</title>
</head>
<body>
    <main class="container">
        <h1>Pokédex</h1>

        <!-- Search & Filter -->
        <div class="controls">
            <input type="text" id="search-input" placeholder="Покемоны нэрээр хайх..." autocomplete="off" />
            <select id="type-select">
                <option value="all">Бүх төрөл</option>
            </select>
        </div>

        <!-- Pokemon Card -->
        <div id="pokemon-grid" class="grid"></div>

        <!-- Infiniti Scroll -->
        <div id="loading-trigger" class="loading">
            <p>Ачаалж байна...</p>
        </div>
    </main>

    <!-- Modal -->
    <dialog id="pokemon-modal" class="modal">
        <button id="close-modal" class="close-btn">&times;</button>
        <div id="modal-content" class="modal-body"></div>
    </dialog>


    <h1>Pokemon API TEST</h1>
    <div class="pokemon-container">

    </div>

    <script src="./js/app.js"></script>
    <script src="./js/pokemon.js"></script>
</body>
</html>
