<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        a {
            text-decoration: none;
        }

        .grid {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
            margin: 30px auto;
        }

        .card {
            width: 300px;
            height: 300px;
            background-color: lightblue;
            color: #fff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            font-weight: bold;
            border-radius: 8px;
            padding: 10px;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .card:hover {
            transform: translateY(-10px);
            box-shadow: 0px 12px 16px rgba(0, 0, 0, 0.3);
        }

        .card-link {
            color: #3c3c3c;
            transition: all 0.25s ease;
        }

        .card-link:hover {
            text-decoration: underline;
            color: #000;
        }

        .card-img {
            height: 140px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            background: #dfe6e9;
            transition: background 0.25s ease;
        }

        .card-img:hover {
            background-color: #000;
        }
    </style>
</head>

<body>
    <div class="grid">
        <div class="card">
            <div class="card-img">📋</div>
            <div class="card-body">
                <h3>ArrayList</h3>
                <p>java.util-ийн динамик массив — зүйл нэмэхэд автоматаар томордог.</p>
                <a href="#" class="card-link">Дэлгэрэнгүй →</a>
            </div>
        </div>
        <div class="card">
            <div class="card-img">🗂️</div>
            <div class="card-body">
                <h3>HashMap</h3>
                <p>Түлхүүр-утга хадгалах, hash функц ашиглан дунджаар O(1) хандалттай.</p>
                <a href="#" class="card-link">Дэлгэрэнгүй →</a>
            </div>
        </div>
        <div class="card">
            <div class="card-img">🔗</div>
            <div class="card-body">
                <h3>Linked List</h3>
                <p>Динамик зангилааны гинж — толгойд O(1) оруулах, Stack болон Queue-ийн суурь.</p>
                <a href="#" class="card-link">Дэлгэрэнгүй →</a>
            </div>
        </div>
    </div>
</body>

</html>
