<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
    .nav-link {
    color: #333;
    text-decoration: none;
    position: relative;
}

.nav-link::after {
    content: '';
    position: absolute;
    bottom: -2px;
    left: 0;
    width: 0;
    height: 2px;
    background: #3498db;
    transition: width 0.3s ease;
}

.nav-link:hover::after {
    width: 100%;
}
</style>
</head>
<body>
<nav>
    <span class="logo">iCode</span>
    <ul class="nav-links">
        <li><a href="#" class="active">Нүүр</a></li>
        <li><a href="#">Хичээлүүд</a></li>
        <li><a href="#">Төслүүд</a></li>
        <li><a href="#">Тухай</a></li>
        <li><a href="#">Холбогдох</a></li>
    </ul>
</nav>
</body>
</html>
