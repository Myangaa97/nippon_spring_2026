<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <style>
        .btn {
        padding: 16px 32px;
        width: 300px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 30px;
        background-color: #3498db;
        color: #fff;
        font-weight: bold;
        border-radius: 8px;
        cursor: pointer;
        transition: all 0.3s ease;
        border: none;
        }

        .btn-scale:hover {
            transform: scale(1.2);
            background-color: tomato;
        }

        .btn-color:hover {
            background-color: tomato;
        }

        .btn-border:hover {
            border: 2px solid tomato;
        }

        .btn-underline:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <button class="btn btn-scale">Томрох + Сүүдэр</button>
    <button class="btn btn-color">Өнгө Солих</button>
    <button class="btn btn-border">Хүрээ Гарч Ирэх</button>
    <button class="btn btn-underline">Доогуур Зураас</button>
</body>

</html>
