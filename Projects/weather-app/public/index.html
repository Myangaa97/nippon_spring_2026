<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <link rel="shortcut icon" href="./images/logo.svg" type="image/x-icon">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/style.css">
    <title>Weather App</title>
</head>

<body>
    <div class="container">
        <div class="header">
            <div class="logo">
                <img src="./images/logo.svg" alt="">
                Weather App
            </div>
            <div class="search-wrapper">
                <input id="search-input" type="text" placeholder="Search for cities">
                <div id="city-suggestions"></div>
            </div>
            <div id="unit-toggle-btn" class="toggle">
                <p class="active">°C</p>
                <p>°F</p>
            </div>
        </div>

        <div id="spinner" class="spinner" style="display: none;"></div>

        <main class="weather-main">
            <div class="weather-content">
                <div class="weather">
                    <div class="city">
                        <p class="city-date"></p>
                        <p class="city-name"></p>
                        <p class="city-temp"></p>
                    </div>
                    <div class="city-w-img"></div>
                </div>
                <div class="weather-forecast">
                    <p>Today’s forecast</p>
                    <div class="today-slider">
                        <div class="today-track"></div>
                    </div>
                </div>
                <div class="weather-details">
                    <p>Weather Details</p>
                    <div class="detail-cards">
                        <div class="detail-card">
                            <div class="detail">
                                <p>Sunrise</p>
                                <h4 class="sunrise"></h4>
                            </div>
                            <img src="./images/sunrise.svg" alt="">
                        </div>
                        <div class="detail-card">
                            <div class="detail">
                                <p>Sunset</p>
                                <h4 class="sunset"></h4>
                            </div>
                            <img src="./images/sunset.svg" alt="">
                        </div>
                        <div class="detail-card">
                            <div class="detail">
                                <p>Chance of rain</p>
                                <h4 class="rain"></h4>
                            </div>
                            <img src="./images/rain.svg" alt="">
                        </div>
                        <div class="detail-card">
                            <div class="detail">
                                <p>Wind</p>
                                <h4 class="wind-speed"></h4>
                            </div>
                            <img src="./images/tabler_wind.svg" alt="">
                        </div>
                        <div class="detail-card">
                            <div class="detail">
                                <p>UV index</p>
                                <h4 class="uv-index"></h4>
                            </div>
                            <img src="./images/mingcute_sun.svg" alt="">
                        </div>
                        <div class="detail-card">
                            <div class="detail">
                                <p class="barometer">Fells like</p>
                                <h4 class="feels-like"></h4>
                            </div>
                            <img src="./images/temperature.svg" alt="">
                        </div>
                    </div>
                </div>
            </div>
            <div class="sidebar">
                <div class="week-head">7 DAYS FORECAST</div>
                <div class="week-list"></div>
            </div>
        </main>
    </div>

    <script src="./js/script.js"></script>
</body>

</html>
