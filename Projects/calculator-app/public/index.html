<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel='stylesheet' href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css'>
    <link rel="stylesheet" href="./css/style.css">
    <title>Calculator in HTML CSS & JavaScript</title>
</head>

<body>
    <div class="app">
        <div class="calculator">
            <div class="display">
                <div class="mode">
                    <p>Calculator</p>
                    <div class="dark-light">
                        <i class='bx bx-moon moon active'></i>
                        <i class='bx bx-sun sun'></i>
                    </div>
                </div>
                <div class="content">
                    <div class="input"></div>
                    <div class="output">0</div>
                </div>
            </div>
            <div class="keys">
                <button class="key action" id="clear">AC</button>
                <button class="key action" id="del">C</button>
                <button class="key action" id="percent">%</button>
                <button class="key operator" id="division">
                    <i class='fas fa-divide'></i>
                </button>

                <button class="key" id="seven">7</button>
                <button class="key" id="eight">8</button>
                <button class="key" id="nine">9</button>
                <button class="key operator" id="multiply">
                    <i class='fas fa-times'></i>
                </button>

                <button class="key" id="four">4</button>
                <button class="key" id="five">5</button>
                <button class="key" id="six">6</button>
                <button class="key operator" id="minus">
                    <i class='fas fa-minus'></i>
                </button>

                <button class="key" id="one">1</button>
                <button class="key" id="two">2</button>
                <button class="key" id="three">3</button>
                <button class="key operator" id="plus">
                    <i class='fas fa-plus'></i>
                </button>

                <button class="key zero" id="zero">0</button>
                <button class="key" id="dot">.</button>
                <button class="key equal" id="equal">
                    <i class="fas fa-equals"></i>
                </button>
            </div>
        </div>
    </div>
    <script src="./js/main.js"></script>
    <script src="./js/darkmode.js"></script>
</body>

</html>
