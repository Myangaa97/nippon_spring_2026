<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin - Posts</title>
</head>
<body>
    <h2>Пост удирдах</h2>

    <a th:href="@{/admin/posts/new}">+ Шинэ пост</a>

    <table border="1">
        <tr>
		    <th>ID</th><th>Гарчиг</th><th>Зохиогч</th><th>Ангилал</th><th>Like</th><th>Огноо</th><th></th>
		</tr>
		<tr th:each="post : ${posts.content}">
		    <td th:text="${post.id}"></td>
		    <td><a th:href="@{/posts/{id}(id=${post.id})}" th:text="${post.title}"></a></td>
		    <td th:text="${post.user.username}"></td>
		    <td th:text="${post.category != null ? post.category.name : '-'}"></td>
		    <td th:text="${post.likeCount}"></td>
		    <td th:text="${#temporals.format(post.createdAt, 'yyyy-MM-dd')}"></td>
		    <td>...</td>
		</tr>
    </table>

    <!-- Pagination -->
    <div th:if="${posts.totalPages > 1}">
        <a th:each="i : ${#numbers.sequence(0, posts.totalPages - 1)}"
           th:href="@{/admin/posts(page=${i})}"
           th:text="${i + 1}"></a>
    </div>
</body>
</html>
