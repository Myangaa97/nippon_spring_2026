<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin - Post Form</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/quill/1.3.7/quill.snow.css" rel="stylesheet"/>
</head>
<body>
    <h2 th:text="${postId} != null ? 'Пост засах' : 'Шинэ пост'"></h2>

    <form id="postForm"
          th:action="${postId} != null ? @{/admin/posts/{id}/edit(id=${postId})} : @{/admin/posts/new}"
          th:object="${postForm}" method="post">

        <input type="text" th:field="*{title}" placeholder="Гарчиг" required/>

        <!-- Quill editor-ийн харагдах хэсэг -->
        <div id="editor" style="height: 300px; margin: 12px 0;" th:utext="*{content}"></div>

        <!-- Жинхэнэ утга серверт явах hidden input -->
        <input type="hidden" id="content" name="content"/>

        <select th:field="*{categoryId}">
            <option value="">Ангилалгүй</option>
            <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}"></option>
        </select>

        <button type="submit">Хадгалах</button>
    </form>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/quill/1.3.7/quill.min.js"></script>
    <script>
        var quill = new Quill('#editor', {
            theme: 'snow',
            modules: {
                toolbar: [
                    ['bold', 'italic', 'underline'],
                    [{ 'header': [1, 2, 3, false] }],
                    [{ 'list': 'ordered'}, { 'list': 'bullet' }],
                    ['link', 'image'],
                    ['clean']
                ]
            }
        });

        // Form илгээхийн өмнө Quill-ийн HTML-ийг hidden input руу хуулна
        document.getElementById('postForm').addEventListener('submit', function() {
            document.getElementById('content').value = quill.root.innerHTML;
        });
    </script>
</body>
</html>
