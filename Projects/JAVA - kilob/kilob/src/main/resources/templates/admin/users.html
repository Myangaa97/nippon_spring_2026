<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin - Users</title>
</head>
<body>
    <h2>Хэрэглэгч удирдах</h2>

    <table>
        <tr>
            <th>Username</th><th>Email</th><th>Role</th><th></th>
        </tr>
        <tr th:each="user : ${users}">
            <td th:text="${user.username}"></td>
            <td th:text="${user.email}"></td>
            <td th:text="${user.role}"></td>
            <td>
                <form th:action="@{/admin/users/{id}/role(id=${user.id})}" method="post">
                    <select name="role">
                        <option value="ROLE_USER">USER</option>
                        <option value="ROLE_ADMIN">ADMIN</option>
                        <option value="ROLE_SUPER_ADMIN">SUPER_ADMIN</option>
                    </select>
                    <button type="submit">Солих</button>
                </form>
            </td>
        </tr>
    </table>
</body>
</html>
