<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="./images/favicon.png" type="image/x-icon">
    <link rel="stylesheet" href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css">
    <link rel="stylesheet" href="./css/pokemon.css">
    <title>My Pokédex</title>
</head>

<body>
    <main class="container">
        <div class="logo">
            <a href="index.html"><img src="./images/logo.svg" alt=""></a>
        </div>

        <div class="search-box">
            <div class="search-icon"><i class='bx bx-search'></i></div>
            <div class="search-input">
                <input type="text" placeholder="Pokemon name, number or type" autocomplete="off" />
            </div>
            <div class="btn second-btn">Search</div>
        </div>

        <div class="filter">
            <div class="sort-dropdown">
                <div class="sort-btn">
                    <span id="selected-sort">Lowest Number First</span>
                    <div class="arrow-up"><img src="./images/arrow-up.svg" alt=""></div>
                    <div class="arrow-down"><img src="./images/arrow-down.svg" alt=""></div>
                </div>

                <ul class="sort-menu">
                    <li data-value="number-asc" class="active">
                        <span>Lowest Number First</span>
                        <i class='bx bx-check'></i>
                    </li>
                    <li data-value="number-desc">
                        <span>Highest Number First</span>
                        <i class='bx bx-check'></i>
                    </li>
                    <li data-value="name-asc">
                        <span>Alphabetically (A-Z)</span>
                        <i class='bx bx-check'></i>
                    </li>
                    <li data-value="name-desc">
                        <span>Alphabetically (Z-A)</span>
                        <i class='bx bx-check'></i>
                    </li>
                </ul>
            </div>

            <div id="filter-btn">
                <i class='bx bx-filter'></i>
                <span>Filter</span>
            </div>

            <div class="filter-modal"></div>
        </div>
        <div id="pokemon-grid" class="pokemon-grid"></div>

        <!-- Infiniti Scroll -->
        <div id="loading-trigger" class="loading">
            <p>Loading...</p>
        </div>
    </main>

    <dialog id="pokemon-modal" class="modal">
        <button id="close-modal" class="close-btn"><i class='bx bx-arrow-back'></i></button>
        <div id="modal-content" class="modal-body"></div>
    </dialog>
    <script src="./js/pokemon.js"></script>
</body>

</html>
