<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Responsive Nav</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

.navbar {
    background: #1a1a2e;
    padding: 0 24px;
}

.nav-inner {
    display: flex;
    flex-direction: column;
    padding: 12px 0;
}

.logo {
    color: white;
    font-size: 20px;
    font-weight: bold;
    text-decoration: none;
    padding: 8px 0;
}

.nav-links {
    display: none;           /* hidden on mobile */
    flex-direction: column;
    gap: 4px;
    padding: 8px 0;
}

.nav-links a {
    color: #ccc;
    text-decoration: none;
    padding: 8px 0;
    font-size: 14px;
}

.nav-links a:hover { color: white; }

/* Show mobile menu hint */
.mobile-hint {
    color: #888;
    font-size: 12px;
    padding: 4px 0;
}

/* Tablet and up */
@media (min-width: 768px) {
    .nav-inner {
        flex-direction: row;
        justify-content: space-between;
        align-items: center;
        padding: 0;
        height: 60px;
    }

    .nav-links {
        display: flex;       /* show on tablet+ */
        flex-direction: row;
        gap: 24px;
        padding: 0;
    }

    .mobile-hint { display: none; }
}</style>
</head>
<body>
<nav class="navbar">
    <div class="nav-inner">
        <a class="logo" href="#">iCode</a>
        <span class="mobile-hint">☰ Menu (resize to see)</span>
        <div class="nav-links">
            <a href="#">Home</a>
            <a href="#">Courses</a>
            <a href="#">About</a>
            <a href="#">Contact</a>
        </div>
    </div>
</nav>
</body>
</html>
