<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel='stylesheet' href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css'>
    <link rel="stylesheet" href="./css/style.css">
    <title>Calculator in HTML CSS & JavaScript</title>
</head>
<body>
    <div class="app">
        <div class="calculator">
            <div class="display">
                <div class="mode">
                    <p>Calculator</p>
                    <div class="dark-light">
                        <i class='bx bx-moon moon active' ></i>
                        <i class='bx bx-sun sun'></i>
                    </div>
                </div>
                <div class="content">
                    <div class="input"></div>
                    <div class="output">0</div>
                </div>
            </div>
            <div class="keys">
                <button class="key action" data-value="AC">AC</button>
                <button class="key action" data-value="C">C</button>
                <button class="key action" data-value="%">%</button>
                <button class="key operator" data-value="/">
                    <i class='fas fa-divide'></i>
                </button>

                <button class="key" data-value="7">7</button>
                <button class="key" data-value="8">8</button>
                <button class="key" data-value="9">9</button>
                <button class="key operator" data-value="*">
                    <i class='fas fa-times'></i>
                </button>

                <button class="key" data-value="4">4</button>
                <button class="key" data-value="5">5</button>
                <button class="key" data-value="6">6</button>
                <button class="key operator" data-value="-">
                    <i class='fas fa-minus'></i>
                </button>

                <button class="key" data-value="1">1</button>
                <button class="key" data-value="2">2</button>
                <button class="key" data-value="3">3</button>
                <button class="key operator" data-value="+">
                    <i class='fas fa-plus'></i>
                </button>

                <button class="key zero" data-value="0">0</button>
                <button class="key" data-value=".">.</button>
                <button class="key equal" data-value="=">
                    <i class="fas fa-equals"></i>
                </button>
            </div>
        </div>
    </div>

    <script src="./js/main.js"></script>
    <script src="./js/darkmode.js"></script>
</body>
</html>
